# Cloudflare Pages configuration.
# Prod is built by Cloudflare Pages' Git integration on every push to `main`,
# and served at https://tarekkaraman.com. Dev runs locally (npm run dev, :5350).
#
# Bindings that must be added in the Cloudflare dashboard (Pages → Settings):
#   Env vars:  ANTHROPIC_API_KEY  (live Claude concierge)
#              ADMIN_KEY          (CMS publish password)
#   KV binding: variable name CONTENT → a KV namespace (live CMS content)
# These are intentionally NOT committed here (secrets never live in the repo).

name = "tarek-cv"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"
